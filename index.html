<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f10">
<title>Примеры сайтов для бизнеса в Астане</title>
<meta name="description" content="Примеры сайтов-визиток для малого бизнеса: барбершопы, салоны, учебные центры.">
<style>
:root{--bg:#0f0f10;--card:#17181a;--ink:#f0eee9;--mut:#9a9890;--line:#2a2b2d;--acc:#e0a574}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:56px 0 30px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1;margin:0 0 12px;font-weight:600;letter-spacing:-.01em}
header p{color:var(--mut);max-width:34em;margin:0}
.grid{display:grid;gap:18px;padding:30px 0 60px;grid-template-columns:1fr}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#4a4b4e}
.th{aspect-ratio:16/10;background:linear-gradient(135deg,#26272a,#121315);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;color:#4a4b4e}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.b{padding:18px 18px 20px}
.tag{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.b h2{font-size:1.25rem;margin:6px 0 8px;font-weight:600}
.b p{margin:0 0 14px;color:var(--mut);font-size:.95rem}
.go{font-size:.85rem;font-weight:600;color:var(--ink)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mut);font-size:.85rem}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="wrap"><h1>Примеры сайтов для бизнеса</h1>
<p>Готовые сайты-визитки с записью через WhatsApp, на русском и казахском. Выберите пример и откройте его с телефона.</p></div></header>
<main class="wrap"><div class="grid" id="g"></div></main>
<footer><div class="wrap">Все названия, цены, адреса и отзывы в примерах вымышленные. Фото созданы нейросетью.</div></footer>
<script src="demos.js"></script>
<script>
(function(){
var g=document.getElementById('g');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
g.innerHTML=(window.DEMOS||[]).map(function(d){
 return '<a class="card" href="'+esc(d.path)+'"><div class="th">'+(d.thumb?'<img loading="lazy" alt="" src="'+esc(d.thumb)+'">':esc((d.title||'?').charAt(0)))+'</div>'+
 '<div class="b"><div class="tag">'+esc(d.niche)+'</div><h2>'+esc(d.title)+'</h2><p>'+esc(d.desc)+'</p><span class="go">Открыть пример →</span></div></a>'}).join('');
})();
</script></body></html>
